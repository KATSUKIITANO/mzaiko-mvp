version: "3.9"

services:
  api:
    build: .
    container_name: mzaiko-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: mzaiko-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: mzaiko-db
    environment:
      POSTGRES_USER: mzaiko
      POSTGRES_PASSWORD: mzaiko_pass
      POSTGRES_DB: mzaiko_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mzaiko -d mzaiko_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mzaiko-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
